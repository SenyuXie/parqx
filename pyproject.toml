[project]
name = "parqx"
version = "0.6.1"
description = "TUI Parquet inspector"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Senyu Xie", email = "senyuxie@qq.com" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.5.5,<2",
    "platformdirs>=4.10.0",
    "pyarrow>=24.0.0",
    "rich>=15.0.0",
    "textual[syntax]>=8.2.7",
    "typer>=0.26.7",
    "tzdata>=2026.2 ; sys_platform == 'win32'",
]

[project.urls]
homepage = "https://github.com/SenyuXie/parqx"
repository = "https://github.com/SenyuXie/parqx"

[project.scripts]
parqx = "parqx.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "poethepoet>=0.49.0",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "textual-dev>=1.8.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "typings"

[tool.poe.executor]
type = "uv"
locked = true

[tool.poe.tasks.check]
help = "Run all checks used by CI"
sequence = ["lint", "typecheck", "full", "package"]

[tool.poe.tasks.lint]
help = "Check lint and formatting"
default_item_type = "cmd"
sequence = ["ruff check", "ruff format --check"]

[tool.poe.tasks.typecheck]
help = "Type-check application code, tests, and helper scripts"
default_item_type = "cmd"
sequence = ["mypy src tests scripts", "pyright"]

[tool.poe.tasks.full]
help = "Run the full test suite"
cmd = "pytest -q tests"

[tool.poe.tasks.core]
help = "Run unit and smoke tests for the compatibility matrix"
cmd = "pytest -q tests/unit tests/smoke"

[tool.poe.tasks.package]
help = "Build and smoke-test fresh wheel and sdist installations"
cmd = "python scripts/check_package.py"

[tool.pyright]
typeCheckingMode = "strict"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/smoke"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "TID",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
