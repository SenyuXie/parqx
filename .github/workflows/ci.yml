name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Distribution smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/distribution/check_install.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/distribution/check_install.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dev dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --diff

  typecheck:
    name: "Type check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dev dependencies
        run: uv sync --locked --group dev
      - name: Mypy
        run: uv run mypy src tests
      - name: Pyright
        run: uv run pyright

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        # Run UI regressions once; cover OS and Python compatibility with the
        # fast contract tests and a real browse/query/quit journey.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
            test-paths: tests
          - os: ubuntu-latest
            python-version: "3.13"
            suite: core
            test-paths: tests/unit tests/smoke
          - os: macos-latest
            python-version: "3.12"
            suite: core
            test-paths: tests/unit tests/smoke
          - os: windows-latest
            python-version: "3.12"
            suite: core
            test-paths: tests/unit tests/smoke
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync dev dependencies
        run: uv sync --locked --group dev
      - name: Pytest
        run: uv run pytest -q ${{ matrix.test-paths }}
