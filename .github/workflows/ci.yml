name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Distribution smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Check distributions
        run: uv run --locked python scripts/check.py package

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check lint and formatting
        run: uv run --locked python scripts/check.py lint

  typecheck:
    name: "Type check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Check types
        run: uv run --locked python scripts/check.py typecheck

  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        # Run UI regressions once; cover OS and Python compatibility with the
        # fast contract tests and a real browse/query/quit journey.
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
          - os: ubuntu-latest
            python-version: "3.13"
            suite: core
          - os: macos-latest
            python-version: "3.12"
            suite: core
          - os: windows-latest
            python-version: "3.12"
            suite: core
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Check tests
        run: uv run --locked python scripts/check.py ${{ matrix.suite }}
